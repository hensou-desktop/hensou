[workspace]
members = [
    "tools/xtask",
    "crates/theme-state",
    "crates/qt-host",
    "crates/files-model",
    "crates/desktop-protocol",
    "crates/files-core",
    "crates/trash",
    "crates/volumes",
    "crates/file-icons",
    "crates/desktop",
    "apps/demo",
    "apps/files",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/hensou-desktop/hensou"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
hensou-files-model = { path = "crates/files-model" }
hensou-desktop-protocol = { path = "crates/desktop-protocol" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1
