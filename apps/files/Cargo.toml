[package]
name = "hensou-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# No workspace lints: the workspace forbids unsafe code, and the cxx-qt bridge
# expands to audited unsafe FFI glue (as in hensou-demo and hensou-qt-host).
# The handwritten Rust in this crate has no unsafe blocks.

[dependencies]
cxx = "=1.0.205"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_full"] }
hensou-qt-host = { path = "../../crates/qt-host" }
hensou-files-model.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", features = ["link_qt_object_files"] }

[[bin]]
name = "hensou-files"
path = "src/main.rs"

[[bin]]
name = "hensou-files-tests"
path = "src/test_main.rs"
