[package]
name = "hensou-demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cxx = "=1.0.205"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_full"] }
hensou-qt-host = { path = "../../crates/qt-host" }

[build-dependencies]
cxx-qt-build = { version = "=0.10.0", features = ["link_qt_object_files"] }

[[bin]]
name = "hensou-demo-tests"
path = "src/test_main.rs"
