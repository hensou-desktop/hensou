name: Verify scaffold

# Deliberately manual until the organization's runner and budget are configured.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaffold-verification
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Verify workspace
        run: cargo xtask check
